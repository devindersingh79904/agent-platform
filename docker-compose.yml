services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
      - yuno_sqlite_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 3000

  telegram-worker:
    build:
      context: ./backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - yuno_sqlite_data:/app/data
    depends_on:
      - backend
    command: python -m app.channels.telegram_worker
    profiles:
      - telegram
    restart: "no"

volumes:
  yuno_sqlite_data:
