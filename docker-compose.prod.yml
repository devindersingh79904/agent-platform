services:
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Devinder AI Agent Studio"
      DATABASE_URL: "sqlite:///./data/agent_studio.db"
      LLM_PROVIDER: "mock"
      USE_MOCK_LLM: "true"
      OPENAI_MODEL: "gpt-4o-mini"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    volumes:
      - backend-data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  scheduler-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: "Devinder AI Agent Studio"
      DATABASE_URL: "sqlite:///./data/agent_studio.db"
      LLM_PROVIDER: "mock"
      USE_MOCK_LLM: "true"
    volumes:
      - backend-data:/app/data
    command: python -m app.scheduler.scheduler_worker

  telegram-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: "Devinder AI Agent Studio"
      DATABASE_URL: "sqlite:///./data/agent_studio.db"
      LLM_PROVIDER: "mock"
      USE_MOCK_LLM: "true"
      TELEGRAM_BOT_TOKEN: ""
      DEFAULT_TELEGRAM_WORKFLOW_ID: ""
    volumes:
      - backend-data:/app/data
    command: python -m app.channels.telegram_worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:8000/api"
        VITE_WS_BASE_URL: "ws://localhost:8000"
        VITE_APP_NAME: "Devinder AI Agent Studio"
    ports:
      - "3000:80"
    depends_on:
      - backend-api

volumes:
  backend-data:
